# ============================================================
# NATHALIE EL-BAZZAL — ACADEMICPAGES CONFIGURATION
# ============================================================

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Nathalie El-Bazzal"
title_separator          : "-"
name                     : &name "Nathalie El-Bazzal"
description              : &description "PhD Candidate in Economics | International Trade, Geoeconomics, Political Economy"
url: "https://nathalie-elbazzal.github.io"
baseurl: ""
repository: "nathalie-elbazzal/nathalie-elbazzal.github.io"


# ============================================================
# SITE AUTHOR
# ============================================================

author:
  avatar           : "photo.jpg"
  name             : "Nathalie El-Bazzal"
  pronouns         :
  bio              : "PhD Candidate in Economics"
  location         : "Paris, France"
  affiliation      : "Paris School of Economics"
  employer         : "University of Paris 8"
  uri              :
  email            : "nathalie.elbazzal@psemail.eu"

  # Academic profiles
  academia         :
  arxiv            :
  googlescholar    :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Repositories
  bitbucket        :
  codepen          :
  dribbble         :
  github           :
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# ============================================================
# PUBLICATION CATEGORIES
# ============================================================

publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Working Papers"
  conferences:
    title: "Conference Papers"


# ============================================================
# SITE SETTINGS
# ============================================================

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : true
  path                   :


# ============================================================
# SEO
# ============================================================

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# ============================================================
# SOCIAL SHARING
# ============================================================

twitter:
  username               :

facebook:
  username               :
  app_id                 :
  publisher              :

og_image: "https://nathalie-elbazzal.github.io/Social-preview-v5.PNG"
og_description: "International Trade & Geoeconomics"
social:
  type                   : "Person"
  name                   : "Nathalie El-Bazzal"
  links:
    - "https://nathalie-elbazzal.github.io"


# ============================================================
# ANALYTICS
# ============================================================

analytics:
  provider               : "false"
  google:
    tracking_id          :


# ============================================================
# READING FILES
# ============================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ============================================================
# CONVERSION
# ============================================================

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# ============================================================
# MARKDOWN PROCESSING
# ============================================================

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# ============================================================
# COLLECTIONS
# ============================================================

collections:
  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# ============================================================
# DEFAULT PAGE SETTINGS
# ============================================================

defaults:

  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false


# ============================================================
# SASS / SCSS
# ============================================================

sass:
  sass_dir: _sass
  style: compressed


# ============================================================
# OUTPUT
# ============================================================

permalink: /:categories/:title/
timezone: Europe/Paris


# ============================================================
# PLUGINS
# ============================================================

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# ============================================================
# ARCHIVES
# ============================================================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# ============================================================
# HTML COMPRESSION
# ============================================================

compress_html:
  clippings: all
  ignore:
    envs: development
